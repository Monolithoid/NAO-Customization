<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAO login screen — layout preview</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e6f2ff; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: linear-gradient(#090e1a, #121f33); }
.preview-note { position: fixed; top: 1rem; left: 1.5rem; margin: 0; color: #9fb5cd; font-size: .8rem; }
main { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 5rem 6vw; gap: 4vw; }
.users { width: min(100%, 25rem); justify-self: center; }
h1 { font-size: 1.65rem; font-weight: 500; margin: 0 0 2rem; }
ul { list-style: none; padding: 0; display: grid; gap: .8rem; }
li { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; background: #192b42; border: 1px solid #314861; border-radius: .8rem; font-size: 1.1rem; }
li:first-child { border-color: #46d4ec; background: #213c55; box-shadow: 0 0 0 2px #46d4ec33; }
.avatar { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%; background: #35516b; color: #cdeaf8; }
.other { display: inline-block; margin-top: .7rem; color: #b7ccdf; }
.mascot { display: block; width: auto; height: min(80vh, 54vw); max-width: 100%; object-fit: contain; justify-self: center; }
@media (max-width: 650px) { main { gap: 1rem; padding: 5rem 1rem; } li { padding: .75rem; } .avatar { display: none; } h1 { font-size: 1.2rem; } }
</style>
</head>
<body>
<p class="preview-note">Layout preview · sample accounts · no authentication</p>
<main>
<section class="users" aria-label="Sample user selection">
<h1>Choose a user</h1>
<ul><li><span class="avatar" aria-hidden="true">A</span>Alex</li><li><span class="avatar" aria-hidden="true">S</span>Sam</li></ul>
<span class="other">Not listed?</span>
</section>
<img class="mascot" src="assets/nao.png" alt="NAO robot raising one arm">
</main>
</body>
</html>
